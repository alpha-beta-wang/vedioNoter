# Video Extract 配置文件
# 修改此文件即可调整所有默认参数，无需改动代码

# -----------------------------------------------------------
# DeepSeek API 配置
# -----------------------------------------------------------
deepseek:
  api_key: ""                                    # 在此填入你的 API key，或设置环境变量 DEEPSEEK_API_KEY
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-pro"
  max_chars_per_chunk: 30000                     # 单次 API 调用最大字符数

# -----------------------------------------------------------
# Whisper 语音识别配置
# -----------------------------------------------------------
whisper:
  model: "small"                                 # 默认模型
  available_models:                              # 可选模型列表
    - tiny
    - tiny.en
    - base
    - base.en
    - small
    - small.en
    - medium
    - medium.en
    - large-v1
    - large-v2
    - large-v3
    - large-v3-turbo

# -----------------------------------------------------------
# 关键帧提取配置
# -----------------------------------------------------------
keyframe:
  scene_threshold: 0.3                           # 场景变化检测阈值 (0-1)，越大越不敏感
  max_frames: 20                                 # 最多提取帧数

# -----------------------------------------------------------
# Web 服务器配置
# -----------------------------------------------------------
server:
  host: "0.0.0.0"
  port: 8765
